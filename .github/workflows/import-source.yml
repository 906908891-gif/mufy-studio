name: Import verified source snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        shell: bash
        run: |
          if [[ ! -f mufy-studio-v23-source.zip ]]; then
            echo "Source archive is not present; nothing to unpack."
            exit 0
          fi
          mkdir .source-import
          unzip -q mufy-studio-v23-source.zip -d .source-import
          cp -a .source-import/. .
          rm -rf .source-import mufy-studio-v23-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Mufy Studio v23 source"
          git push
